<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discriptografio: criptografe e descriptografe mensagens com um embaralhamento de vogais.">
    <meta name="theme-color" content="#050001">
    <link rel="icon" type="image/svg+xml" href="assets/eye-thin.svg">
    <link rel="stylesheet" href="style/style.css">

    <title>Discriptografio</title>
</head>
<body>
    <header class="cabecalho">
        <a href="https://loselportifolio.vercel.app/index.html" class="cabecalho__link" aria-label="Voltar ao portfólio do Losel">
            <img src="assets/black-hole.svg" alt="" width="40" height="40">
            <span class="cabecalho__titulo">Discriptografio</span>
        </a>
        <button type="button" id="sound-btn" class="sound-btn" aria-pressed="false" aria-label="Ligar som ambiente">
            <svg class="sound-btn__on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
            <svg class="sound-btn__off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.6 2 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>
        </button>
    </header>

    <main>
        <section class="input__box" aria-labelledby="input-label">
            <form>
                <label id="input-label" for="input-textarea" class="sr-only">Texto para criptografar ou descriptografar</label>
                <textarea id="input-textarea" placeholder="Digite seu texto" spellcheck="false"></textarea>
            </form>
            <div class="warning__box">
                <img src="assets/morcegu.gif" alt="" width="32" height="32">
                <p>Apenas letras minúsculas e sem acento.</p>
            </div>
            <div class="buttons__box">
                <button type="button" id="encode-btn">Criptografar</button>
                <button type="button" id="decode-btn">Descriptografar</button>
            </div>
        </section>

        <section class="output_box" aria-live="polite">
            <form>
                <div class="img__box">
                    <img src="assets/eye.gif" alt="" width="160" height="160">
                    <div class="mesage__box">
                        <h2>Nenhuma mensagem encontrada.</h2>
                        <p>Digite um texto que você deseja criptografar ou descriptografar.</p>
                    </div>
                </div>
                <label for="output-textarea" class="sr-only">Resultado</label>
                <textarea id="output-textarea" readonly></textarea>
            </form>
            <div class="copy__btn__box">
                <button type="button" id="copy-btn">Copiar</button>
            </div>
        </section>
    </main>

    <footer>
        Desenvolvido por <a href="https://github.com/LoselSpt" target="_blank" rel="noopener noreferrer">Losel</a>

        <audio id="bg-audio" src="assets/timeblur.mp3" preload="none" loop></audio>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="main.js"></script>
</body>
</html>
